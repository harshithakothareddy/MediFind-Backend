server.port=8080
server.servlet.context-path=/api

# Database Configuration (MySQL 8)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medifind?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:manager}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Security & JWT
app.jwt.secret=${JWT_SECRET:u/q56I+p1tPwtsvpl0IYTUrBZUiJ4zChRXHOGdjYYTM=}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Demo accounts for deployment and portfolio showcase
app.demo-users.enabled=${SEED_DEMO_USERS:true}
app.demo-users.admin-password=${DEMO_ADMIN_PASSWORD:admin123}
app.demo-users.pharmacy-password=${DEMO_PHARMACY_PASSWORD:pharmacy123}
app.demo-users.user-password=${DEMO_USER_PASSWORD:user123}

# Prescription documents are kept outside static resources and served only after authorization.
app.prescriptions.storage-directory=${PRESCRIPTION_STORAGE_DIR:private-uploads/prescriptions}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# CORS & Frontend
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# SpringDoc / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Logging
logging.file.name=backend.log
logging.level.com.medifind=INFO
logging.level.org.springframework.security=WARN
